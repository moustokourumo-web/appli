<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Écran PC - Récepteur Stable</title>
    <!-- Chargement du réseau de communication en temps réel Ably -->
    <script src="https://ably.com"></script>
    <style>
        body {
            margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: linear-gradient(to bottom, #FF416C, #8A2387); font-family: Arial, sans-serif;
        }
        #photo-flux {
            width: 90%; max-width: 640px; height: auto; min-height: 360px;
            background-color: black; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: block;
        }
        #statut { color: white; font-weight: bold; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 20px; margin-top: 20px; }
    </style>
</head>
<body>

    <img id="photo-flux" src="" alt="En attente du flux vidéo...">
    <div id="statut">Écran PC : Connexion au réseau stable en cours...</div>

    <script>
        const imgElem = document.getElementById('photo-flux');
        const statut = document.getElementById('statut');

        // Connexion à la clé réseau publique temporaire
        const ably = new Ably.Realtime('h26zLg.g35bCg:YfD_59n9_3T62UuL997wPeeAeaLhN4-xX5X9r75Uj0Y');
        const canal = ably.channels.get('salon-logan');

        ably.connection.on('connected', () => {
            statut.innerText = "Écran PC : Connecté ! Lancez le téléphone...";
        });

        // Le PC capte les images envoyées sur le canal réseau
        canal.subscribe('flux-video', (message) => {
            statut.innerText = "🔴 EN DIRECT DEPUIS TON TÉLÉPHONE !";
            imgElem.src = message.data;
        });
    </script>
</body>
</html>
