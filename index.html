<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Écran PC - Récepteur</title>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body {
            margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: linear-gradient(to bottom, #FF416C, #8A2387); font-family: Arial, sans-serif;
        }
        #video-flux {
            width: 90%; max-width: 640px; background-color: black; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #statut { color: white; font-weight: bold; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 20px; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Le PC affiche UNIQUEMENT la vidéo reçue -->
    <video id="video-flux" autoplay playsinline></video>
    <div id="statut">Écran PC : En attente du signal du téléphone...</div>

    <script>
        const firebaseConfig = { databaseURL: "https://firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const base = firebase.database().ref("salon_logan");

        // Le PC dit à la base qu'il est prêt et en attente
        base.set({ commande: "attente", fluxData: "" });

        const videoElem = document.getElementById('video-flux');
        const statut = document.getElementById('statut');

        // Le PC écoute la base de données
        base.on('value', (snapshot) => {
            const donnees = snapshot.val();
            if (!donnees) return;

            if (donnees.commande === "filme" && donnees.fluxData) {
                statut.innerText = "🔴 En direct depuis ton téléphone !";
                // On affiche la photo/image envoyée en continu par le téléphone
                videoElem.style.display = "none"; // On va tricher avec une image en continu si la vidéo pure coupe
                
                // Si c'est une image de caméra en continu (Base64)
                let img = document.getElementById('photo-flux');
                if (!img) {
                    img = document.createElement('img');
                    img.id = 'photo-flux';
                    img.style.width = "90%";
                    img.style.maxWidth = "640px";
                    img.style.borderRadius = "12px";
                    document.body.insertBefore(img, statut);
                }
                img.src = donnees.fluxData;
            }
        });
    </script>
</body>
</html>
