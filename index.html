<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Appli Caméra avec Base</title>
    <!-- Chargement de la base de données Google Firebase -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #FF416C, #8A2387);
            font-family: Arial, sans-serif;
            gap: 20px;
        }
        #video-cam {
            width: 85%;
            max-width: 500px;
            background-color: black;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
            transform: scaleX(-1);
        }
        .btn-vert {
            background-color: #2ecc71; 
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #statut {
            color: white;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <!-- La vidéo s'affichera sur l'appareil qui a la caméra activée -->
    <video id="video-cam" autoplay playsinline></video>

    <!-- Le bouton vert -->
    <button class="btn-vert" id="bouton-action" onclick="clicBouton()">
        Clique ici 📷
    </button>

    <div id="statut">Connexion à la base de données...</div>

    <script>
        // Configuration de la base de données de secours
        const firebaseConfig = {
            databaseURL: "https://firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const base = firebase.database().ref("salon_logan");

        const estMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
        const bouton = document.getElementById('bouton-action');
        const videoElem = document.getElementById('video-cam');
        const statut = document.getElementById('statut');
        let fluxVideo = null;

        // On remet la base à zéro au démarrage
        if (!estMobile) {
            base.set({ action: "attente" });
        }

        // ÉCOUTE DE LA BASE DE DONNÉES EN TEMPS RÉEL
        base.on('value', async (snapshot) => {
            const donnees = snapshot.val();
            if (!donnees) return;

            if (!estMobile) {
                // --- CÔTÉ PC ---
                bouton.style.display = "none"; // Cache le bouton sur PC
                statut.innerText = "Mode PC : En attente du signal de la base...";

                if (donnees.action === "allume" && !fluxVideo) {
                    statut.innerText = "Signal reçu ! Activation caméra du PC...";
                    try {
                        fluxVideo = await navigator.mediaDevices.getUserMedia({ video: true });
                        videoElem.style.display = "block";
                        videoElem.srcObject = fluxVideo;
                        statut.innerText = "Caméra PC activée 👁️";
                    } catch (err) {
                        base.set({ action: "erreur" });
                    }
                }
            } else {
                // --- CÔTÉ TÉLÉPHONE ---
                videoElem.style.display = "none"; // Pas de vidéo sur le tel
                statut.innerText = "Mode Téléphone connecté à la base.";

                if (donnees.action === "erreur") {
                    alert("ha ha ha");
                    base.set({ action: "attente" });
                }
            }
        });

        // ACTION QUAND LE TÉLÉPHONE CLIQUE SUR LE BOUTON VERT
        function clicBouton() {
            if (estMobile) {
                statut.innerText = "Envoi de l'ordre à la base de données...";
                // Le téléphone écrit "allume" dans la base Google
                base.set({ action: "allume" });
            }
        }
    </script>

</body>
</html>
