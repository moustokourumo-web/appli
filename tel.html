<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Télécommande Téléphone</title>
    <!-- CORRECTION : Lien officiel et fonctionnel du script Ably -->
    <script src="https://ably.com"></script>
    <style>
        body {
            margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: linear-gradient(to bottom, #FF416C, #8A2387); font-family: Arial, sans-serif;
        }
        .btn-vert {
            background-color: #2ecc71; color: white; border: none; padding: 20px 40px;
            font-size: 24px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #statut { color: white; margin-top: 20px; font-weight: bold; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 10px; }
        canvas { display: none; }
    </style>
</head>
<body>

    <button class="btn-vert" onclick="allumerEtEnvoyer()">Clique ici 📷</button>
    <div id="statut">Connexion au réseau...</div>
    
    <video id="cam" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('cam');
        const canvas = document.getElementById('canvas');
        const statut = document.getElementById('statut');
        const ctx = canvas.getContext('2d');

        const ably = new Ably.Realtime('h26zLg.g35bCg:YfD_59n9_3T62UuL997wPeeAeaLhN4-xX5X9r75Uj0Y');
        const canal = ably.channels.get('salon-logan');

        ably.connection.on('connected', () => {
            statut.innerText = "Prêt à se connecter au PC.";
        });

        async function allumerEtEnvoyer() {
            statut.innerText = "Demande d'accès caméra...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                statut.innerText = "Transmission en cours au PC... ⚡";

                setInterval(() => {
                    canvas.width = 320; 
                    canvas.height = 240;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const imageTexte = canvas.toDataURL('image/jpeg', 0.4); 
                    
                    canal.publish('flux-video', imageTexte);
                }, 250);

            } catch (err) {
                alert("ha ha ha");
                statut.innerText = "Erreur : " + err.message;
            }
        }
    </script>
</body>
</html>
